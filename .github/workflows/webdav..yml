name: 上传音乐到云盘（文件逐一去重）

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'

permissions:
  contents: read

jobs:
  upload-music:
    runs-on: ubuntu-latest
    env:
      WEBDAV_URL: ${{ secrets.WEBDAV_URL }}
      WEBDAV_USER: ${{ secrets.WEBDAV_USER }}
      WEBDAV_PASS: ${{ secrets.WEBDAV_PASS }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装工具
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip md5sum curl
          curl https://rclone.org/install.sh | sudo bash

      - name: 配置WebDAV
        run: |
          rclone config create webdav webdav url="${WEBDAV_URL}" vendor=other user="${WEBDAV_USER}" pass="${WEBDAV_PASS}" --non-interactive

      - name: 逐一检测并上传文件
        run: |
          UPLOAD_PATH="webdav:/music"
          rclone mkdir "$UPLOAD_PATH" || true

          find public/music -type f \( -name "*.mp3" -o -name "*.flac" -o -name "*.wav" -o -name "*.m4a" -o -name "*.ogg" -o -name "*.aac" \) | while read file; do
            filename=$(basename "$file")
            
            echo "🎵 检测文件: $filename"

            local_md5=$(md5sum "$file" | awk '{print $1}')

            rclone ls "$UPLOAD_PATH/$filename" >/dev/null 2>&1
            if [ $? -eq 0 ]; then
              rclone copy "$UPLOAD_PATH/$filename" "/tmp/$filename"
              remote_md5=$(md5sum "/tmp/$filename" | awk '{print $1}')
              
              if [ "$local_md5" == "$remote_md5" ]; then
                echo "✅ 文件一致 → 跳过上传: $filename"
                continue
              else
                echo "⚠️ 同名文件但内容不同 → 重新上传: $filename"
              fi
            else
              echo "🆕 云盘不存在该文件 → 上传: $filename"
            fi

            rclone copy "$file" "$UPLOAD_PATH" --progress
          done

          echo "🎉 完成全部任务"
